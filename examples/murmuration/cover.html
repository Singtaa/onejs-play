<!doctype html>
<meta charset="utf-8">
<!--
  The card for this game.

  The same three rules the game runs, on a smaller flock, so the card is the
  thing rather than a picture of it.
-->
<style>
    html, body { margin: 0; height: 100%; background: #090c14; overflow: hidden; }
    canvas { display: block; width: 100%; height: 100%; }
</style>
<body>
<canvas id="sky"></canvas>
<script>
const canvas = document.getElementById("sky")
const ctx = canvas.getContext("2d")
let W = 0, H = 0
function fit() {
    const dpr = Math.min(2, window.devicePixelRatio || 1)
    W = canvas.clientWidth; H = canvas.clientHeight
    canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr)
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0)
}
fit(); addEventListener("resize", fit)

const COUNT = 90
const RANGE = 44, PERSONAL = 16, MARGIN = 60
const MIN_SPEED = 55, MAX_SPEED = 150
const birds = []
let seed = 12345
const rand = () => ((seed = (seed * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff)

function seedFlock() {
    birds.length = 0
    for (let i = 0; i < COUNT; i++) {
        const a = rand() * Math.PI * 2
        const s = MIN_SPEED + rand() * (MAX_SPEED - MIN_SPEED)
        birds.push({ x: rand() * W, y: rand() * H, vx: Math.cos(a) * s, vy: Math.sin(a) * s })
    }
}

/* Small enough that the whole-flock comparison is fine here; the game uses a
   spatial grid because it runs ten times as many. */
function step(dt) {
    const was = birds.map((b) => ({ vx: b.vx, vy: b.vy }))
    for (let i = 0; i < birds.length; i++) {
        const self = birds[i]
        let px = 0, py = 0, avx = 0, avy = 0, cx = 0, cy = 0, seen = 0
        for (let j = 0; j < birds.length; j++) {
            if (j === i) continue
            const other = birds[j]
            const dx = self.x - other.x, dy = self.y - other.y
            const d = Math.hypot(dx, dy)
            if (d > RANGE || d === 0) continue
            if (d < PERSONAL) { px += (dx / d) * (PERSONAL - d) / PERSONAL; py += (dy / d) * (PERSONAL - d) / PERSONAL }
            avx += was[j].vx; avy += was[j].vy; cx += other.x; cy += other.y; seen++
        }
        self.vx += px * 0.34; self.vy += py * 0.34
        if (seen > 0) {
            self.vx += (avx / seen - was[i].vx) * 0.05
            self.vy += (avy / seen - was[i].vy) * 0.05
            self.vx += (cx / seen - self.x) * 0.0016
            self.vy += (cy / seen - self.y) * 0.0016
        }
        if (self.x < MARGIN) self.vx += 220 * (1 - self.x / MARGIN) * dt
        if (self.x > W - MARGIN) self.vx -= 220 * (1 - (W - self.x) / MARGIN) * dt
        if (self.y < MARGIN) self.vy += 220 * (1 - self.y / MARGIN) * dt
        if (self.y > H - MARGIN) self.vy -= 220 * (1 - (H - self.y) / MARGIN) * dt
        const s = Math.hypot(self.vx, self.vy)
        if (s > 1e-9) {
            const want = Math.min(MAX_SPEED, Math.max(MIN_SPEED, s))
            self.vx = (self.vx / s) * want; self.vy = (self.vy / s) * want
        }
    }
    for (const b of birds) {
        b.x = Math.min(W, Math.max(0, b.x + b.vx * dt))
        b.y = Math.min(H, Math.max(0, b.y + b.vy * dt))
    }
}

function draw() {
    ctx.fillStyle = "#090c14"
    ctx.fillRect(0, 0, W, H)
    const unit = Math.min(W, H)
    for (const b of birds) {
        const s = Math.hypot(b.vx, b.vy)
        if (s < 0.001) continue
        const heat = Math.min(1, Math.max(0, (s - MIN_SPEED) / (MAX_SPEED - MIN_SPEED)))
        const r = Math.round(74 + (237 - 74) * heat)
        const g = Math.round(107 + (242 - 107) * heat)
        const bl = Math.round(184 + (255 - 184) * heat)
        ctx.fillStyle = `rgba(${r}, ${g}, ${bl}, ${0.55 + heat * 0.4})`
        const ux = b.vx / s, uy = b.vy / s
        const nose = unit * 0.022, back = unit * 0.010, flare = unit * 0.008
        ctx.beginPath()
        ctx.moveTo(b.x + ux * nose, b.y + uy * nose)
        ctx.lineTo(b.x - ux * back - uy * flare, b.y - uy * back + ux * flare)
        ctx.lineTo(b.x - ux * back * 0.35, b.y - uy * back * 0.35)
        ctx.lineTo(b.x - ux * back + uy * flare, b.y - uy * back - ux * flare)
        ctx.closePath()
        ctx.fill()
    }
}

seedFlock()
let last = performance.now()
function frame(now) {
    requestAnimationFrame(frame)
    const dt = Math.min(0.05, (now - last) / 1000)
    last = now
    step(dt)
    draw()
}

if (matchMedia("(prefers-reduced-motion: reduce)").matches) {
    /* Let it organise itself, then hold still. */
    for (let i = 0; i < 200; i++) step(1 / 60)
    draw()
} else {
    requestAnimationFrame(frame)
}
</script>
</body>
