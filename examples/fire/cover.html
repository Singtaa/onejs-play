<!doctype html>
<meta charset="utf-8">
<!--
  The card for this game: the same flame the game makes, made the same way.

  Not a recording and not a sprite. The game builds its fire by scrolling two
  noise fields through a soft tapered envelope, thresholding the product into
  tongues and colouring what survives through an ember ramp; this does exactly
  that, on a small buffer, in 2D canvas. Keeping the method rather than the
  picture is what makes the card still true when the game's tuning changes, and
  it is why the card flickers and breaks into licks the way the game does
  instead of looping a fixed animation.

  The buffer is deliberately tiny. The flame is a function of normalised uv, so
  an 80 by 84 field is the same fire as the 512 one, just sampled coarser, and
  the upscale blurs it in roughly the way the real blur does. Several of these
  can be on a catalog page at once, so it has to be cheap.
-->
<style>
    html, body { margin: 0; height: 100%; background: #07070a; overflow: hidden; }
    canvas { display: block; width: 100%; height: 100%; }
</style>
<body>
<canvas id="fire"></canvas>
<script>
const canvas = document.getElementById("fire")
const ctx = canvas.getContext("2d")

/* The field, in cells. Taller than wide because a flame is. */
const FW = 80, FH = 84

/* The offscreen the field is written to, then scaled up onto the card. */
const buf = document.createElement("canvas")
buf.width = FW; buf.height = FH
const bctx = buf.getContext("2d")
const img = bctx.createImageData(FW, FH)

let W = 0, H = 0
function fit() {
    const dpr = Math.min(2, window.devicePixelRatio || 1)
    W = canvas.clientWidth; H = canvas.clientHeight
    canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr)
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0)
    ctx.imageSmoothingEnabled = true
}
fit(); addEventListener("resize", fit)

/* Integer hash rather than Math.random: the field has to be the same every
   frame and only move because its offset moved. A random lattice would boil. */
/* Math.imul and >>> throughout, not * and >>. A plain multiply here produces a
   double past 2^53, and the low bits the next shift wants are already gone by
   then: the field came out with a mean of 0.22 and a ceiling of 0.43 instead of
   filling 0 to 1, so the threshold downstream had almost nothing to cut and the
   fire rendered as a dim red sliver. Measured, not guessed. */
function hash(x, y) {
    let h = Math.imul(x, 374761393) + Math.imul(y, 668265263)
    h = Math.imul(h ^ (h >>> 13), 1274126177)
    return ((h ^ (h >>> 16)) >>> 0) / 4294967295
}

const smooth = (t) => t * t * (3 - 2 * t)

/* Value noise on a square lattice. The game uses simplex, which has no
   axis-aligned structure to leak; at this scale, upscaled and thresholded, the
   grid does not survive to be seen, and simplex here would cost more than it
   returns. */
function noise(x, y) {
    const xi = Math.floor(x), yi = Math.floor(y)
    const xf = smooth(x - xi), yf = smooth(y - yi)
    const a = hash(xi, yi), b = hash(xi + 1, yi)
    const c = hash(xi, yi + 1), d = hash(xi + 1, yi + 1)
    return (a + (b - a) * xf) * (1 - yf) + (c + (d - c) * xf) * yf
}

/* Two octaves, matching the shape of the game's fbm without its cost. */
function fbm(x, y) {
    return noise(x, y) * 0.62 + noise(x * 2.35, y * 2.35) * 0.38
}

/* The ember ramp, straight off the game's EMBERS. Alpha included, because the
   low end of the ramp is transparent: that is what lets the flame sit on the
   card's background instead of on a black rectangle. */
const RAMP = [
    { at: 0.00, c: [38, 0, 0], a: 0 },
    { at: 0.30, c: [178, 15, 0], a: 0.55 },
    { at: 0.52, c: [255, 71, 5], a: 0.92 },
    { at: 0.74, c: [255, 158, 20], a: 1 },
    { at: 1.00, c: [255, 237, 158], a: 1 },
]

const BG = [7, 7, 10]

function rampAt(t, out) {
    let i = 1
    while (i < RAMP.length - 1 && t > RAMP[i].at) i++
    const lo = RAMP[i - 1], hi = RAMP[i]
    const k = hi.at === lo.at ? 0 : (t - lo.at) / (hi.at - lo.at)
    const f = k < 0 ? 0 : k > 1 ? 1 : k
    const a = lo.a + (hi.a - lo.a) * f
    /* Composited here rather than left transparent: the card paints one opaque
       image, so a half-lit ember reads against the card's own background rather
       than against whatever the browser puts behind an alpha canvas. */
    for (let ch = 0; ch < 3; ch++) {
        const v = lo.c[ch] + (hi.c[ch] - lo.c[ch]) * f
        out[ch] = BG[ch] + (v - BG[ch]) * a
    }
}

/**
 * How strongly a flame is allowed to exist at this cell.
 *
 * An uneven capsule: wide at the base, nearly a point at the top, which is the
 * shape the game uses. An ellipse lights as an ellipse and reads as a glowing
 * blob rather than as fire. Multiplied by a base-to-tip falloff so the
 * threshold downstream breaks the top into separate tongues.
 */
const envelope = new Float32Array(FW * FH)
function buildEnvelope(lean) {
    const cx = FW * 0.5
    for (let y = 0; y < FH; y++) {
        /* v is 0 at the base and 1 at the tip. */
        const v = 1 - y / (FH - 1)
        /* The lean shifts the axis further the higher up it goes, which is how a
           flame actually bends: the base stays where the fuel is. */
        const axis = cx + lean * v * v * FW * 0.30
        /* A fat belly low down tapering to a point, which is the uneven capsule
           the game uses. A linear taper gave a blade rather than a flame: the
           exponent is what puts the width back into the lower two thirds. */
        const radius = (0.08 + 0.46 * Math.pow(1 - v, 0.5)) * FW
            * (v > 0.92 ? (1 - v) / 0.08 : 1)
        for (let x = 0; x < FW; x++) {
            const d = Math.abs(x - axis)
            /* Soft edge, not a hard mask: a hard one leaves the silhouette's own
               outline visible wherever the noise was bright. */
            const e = radius <= 0 ? 0 : 1 - d / radius
            const fromBase = Math.pow(1 - v, 0.62)
            envelope[y * FW + x] = e <= 0 ? 0 : smooth(Math.min(1, e)) * fromBase
        }
    }
}

let t = 0
let lean = 0
let leanTarget = 0
let sinceGust = 0
const rgb = [0, 0, 0]

function step(dt) {
    t += dt
    /* An occasional gust, so a card left on screen is not one loop repeating.
       The game gets this from a finger; here it arrives on its own. */
    sinceGust -= dt
    if (sinceGust <= 0) {
        leanTarget = (hash(Math.floor(t * 7), 91) - 0.5) * 0.7
        sinceGust = 1.8 + hash(Math.floor(t * 3), 17) * 2.6
    }
    lean += (leanTarget - lean) * Math.min(1, dt * 1.6)
    buildEnvelope(lean)

    const data = img.data
    /* Two rates, so the fine detail outruns the body and the picture never
       resolves into one sliding texture. Negative in y because the field has to
       travel the way the flame rises. */
    const aY = -t * 1.05, bY = -t * 1.55
    for (let y = 0; y < FH; y++) {
        const u = y / FH
        for (let x = 0; x < FW; x++) {
            const e = envelope[y * FW + x]
            let o = (y * FW + x) * 4
            if (e <= 0.001) {
                data[o] = BG[0]; data[o + 1] = BG[1]; data[o + 2] = BG[2]; data[o + 3] = 255
                continue
            }
            const s = x / FW
            const body = fbm(s * 3.1, u * 2.0 + aY)
            const detail = fbm(s * 4.3 + 11.7, u * 3.4 + bY)
            const heat = (body * 0.55 + detail * 0.45) * e
            /* The threshold is what turns fog into licks: the band starts above
               the product's mean so only the peaks survive. */
            let f = (heat - 0.115) / (0.34 - 0.115)
            f = f < 0 ? 0 : f > 1 ? 1 : f
            rampAt(f, rgb)
            data[o] = rgb[0]; data[o + 1] = rgb[1]; data[o + 2] = rgb[2]; data[o + 3] = 255
        }
    }
    bctx.putImageData(img, 0, 0)
}

function draw() {
    ctx.fillStyle = "#07070a"
    ctx.fillRect(0, 0, W, H)
    /* Anchored to the bottom and sized off the height, so the flame stands on
       the card whatever aspect the card happens to be. */
    const h = H
    const w = h * (FW / FH)
    ctx.drawImage(buf, (W - w) / 2, H - h, w, h)
}

let last = performance.now()
let acc = 0
/* Capped at 30, because the buffer is redrawn on the CPU and a catalog page can
   hold several of these. The fire has no motion fast enough to need more. */
const STEP = 1 / 30

function frame(now) {
    requestAnimationFrame(frame)
    const dt = Math.min(0.05, (now - last) / 1000)
    last = now
    acc += dt
    if (acc < STEP) return
    step(acc)
    acc = 0
    draw()
}

if (matchMedia("(prefers-reduced-motion: reduce)").matches) {
    /* Settled rather than blank: a still frame of a lit fire still says what the
       game is, which a black card does not. */
    for (let i = 0; i < 40; i++) step(STEP)
    draw()
} else {
    requestAnimationFrame(frame)
}
</script>
</body>
