<!doctype html>
<meta charset="utf-8">
<!--
  The card for this game.

  Canvas rather than CSS, because a firework is a few hundred moving points and
  keyframing those is not a thing anybody should do by hand. It is the same idea
  as the game, at a size that fits on a card and with a fraction of the sparks.
-->
<style>
    html, body { margin: 0; height: 100%; background: #080a10; overflow: hidden; }
    canvas { display: block; width: 100%; height: 100%; }
</style>
<body>
<canvas id="sky"></canvas>
<script>
const canvas = document.getElementById("sky")
const ctx = canvas.getContext("2d")

/* The card is laid out by the gallery, so its size is whatever it turns out to
   be, and it changes when the page is resized. */
let W = 0, H = 0
function fit() {
    const dpr = Math.min(2, window.devicePixelRatio || 1)
    W = canvas.clientWidth
    H = canvas.clientHeight
    canvas.width = Math.round(W * dpr)
    canvas.height = Math.round(H * dpr)
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0)
}
fit()
addEventListener("resize", fit)

const SHELLS = ["#ff9a20", "#ff3b30", "#34d058", "#3b82f6", "#a855f7", "#9fd8ff"]
const GRAVITY = 120

const rockets = []
const sparks = []
let next = 0.3

function launch() {
    const targetX = W * (0.15 + Math.random() * 0.7)
    const targetY = H * (0.15 + Math.random() * 0.35)
    const rise = H - targetY
    const vy = -Math.sqrt(2 * GRAVITY * rise)
    const climb = Math.abs(vy) / GRAVITY
    rockets.push({
        x: targetX, y: H, vx: 0, vy,
        colour: SHELLS[(Math.random() * SHELLS.length) | 0],
    })
    void climb
}

function burst(r) {
    for (let i = 0; i < 70; i++) {
        const angle = Math.random() * Math.PI * 2
        const speed = 40 + Math.random() * 30
        sparks.push({
            x: r.x, y: r.y,
            vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
            life: 0, span: 0.9 + Math.random() * 0.7, colour: r.colour,
        })
    }
}

let last = performance.now()
function frame(now) {
    requestAnimationFrame(frame)
    const dt = Math.min(0.05, (now - last) / 1000)
    last = now

    /* Trails rather than a clear: painting a translucent black over the whole
       canvas leaves each spark smeared behind itself, which is most of what a
       firework looks like and costs one fill. */
    ctx.globalCompositeOperation = "source-over"
    ctx.fillStyle = "rgba(8, 10, 16, 0.28)"
    ctx.fillRect(0, 0, W, H)
    ctx.globalCompositeOperation = "lighter"

    next -= dt
    if (next <= 0) { next = 0.5 + Math.random() * 1.4; launch() }

    for (let i = rockets.length - 1; i >= 0; i--) {
        const r = rockets[i]
        r.x += r.vx * dt
        r.y += r.vy * dt + 0.5 * GRAVITY * dt * dt
        r.vy += GRAVITY * dt
        if (r.vy >= 0) { burst(r); rockets.splice(i, 1); continue }
        ctx.fillStyle = "#ffe0a0"
        ctx.fillRect(r.x - 1, r.y - 1, 2.5, 2.5)
    }

    for (let i = sparks.length - 1; i >= 0; i--) {
        const s = sparks[i]
        s.life += dt
        if (s.life >= s.span) { sparks.splice(i, 1); continue }
        s.vy += GRAVITY * 0.55 * dt
        s.vx *= 1 - 1.1 * dt
        s.vy *= 1 - 1.1 * dt
        s.x += s.vx * dt
        s.y += s.vy * dt
        ctx.globalAlpha = 1 - s.life / s.span
        ctx.fillStyle = s.colour
        ctx.fillRect(s.x - 1, s.y - 1, 2.5, 2.5)
    }
    ctx.globalAlpha = 1
}

/* Anyone who would rather things held still gets one shell, once. */
if (matchMedia("(prefers-reduced-motion: reduce)").matches) {
    ctx.fillStyle = "#080a10"
    ctx.fillRect(0, 0, W, H)
    launch()
    const r = rockets[0]
    r.x = W / 2; r.y = H * 0.4
    burst(r)
    rockets.length = 0
    ctx.globalCompositeOperation = "lighter"
    for (const s of sparks) {
        ctx.globalAlpha = 0.85
        ctx.fillStyle = s.colour
        ctx.fillRect(s.x + s.vx * 0.6 - 1, s.y + s.vy * 0.6 - 1, 2.5, 2.5)
    }
} else {
    requestAnimationFrame(frame)
}
</script>
</body>
