<!doctype html>
<meta charset="utf-8">
<!-- Any cover.html beside your source becomes this game's card. Keep it light. -->
<style>
    html, body { margin: 0; height: 100%; background: #12151b; overflow: hidden; }
    .field { position: relative; width: 100%; height: 100% }
    .ball {
        position: absolute; width: 8cqmin; height: 8cqmin; border-radius: 50%;
        background: #ffd166; animation: bounce 2.4s cubic-bezier(.4,0,.6,1) infinite;
    }
    .paddle {
        position: absolute; bottom: 12%; width: 34cqmin; height: 5cqmin;
        border-radius: 3cqmin; background: #5ac8fa;
        animation: track 2.4s cubic-bezier(.4,0,.6,1) infinite;
    }
    @keyframes bounce {
        0%   { left: 22%; top: 14% }
        50%  { left: 62%; top: 74% }
        100% { left: 22%; top: 14% }
    }
    @keyframes track {
        0%   { left: 14% }
        50%  { left: 52% }
        100% { left: 14% }
    }
    @media (prefers-reduced-motion: reduce) {
        .ball, .paddle { animation: none }
        .ball { left: 42%; top: 40% }
        .paddle { left: 33% }
    }
</style>
<div class="field">
    <div class="ball"></div>
    <div class="paddle"></div>
</div>
