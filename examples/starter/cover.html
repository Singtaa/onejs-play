<!doctype html>
<meta charset="utf-8">
<!-- Any cover.html beside your source becomes this game's card. Keep it light. -->
<style>
    html, body { margin: 0; height: 100%; background: #171717; overflow: hidden }
    .field { position: relative; width: 100%; height: 100% }
    .dot {
        position: absolute; left: 50%; top: 50%; border-radius: 50%;
        background: #ffd166; width: 34cqmin; height: 34cqmin; margin: -17cqmin;
        animation: shrink 1.8s ease-in infinite;
    }
    @keyframes shrink {
        0%   { transform: scale(1); opacity: 1 }
        85%  { transform: scale(0.12); opacity: 1 }
        100% { transform: scale(0.12); opacity: 0 }
    }
    @media (prefers-reduced-motion: reduce) {
        .dot { animation: none; transform: scale(0.6) }
    }
</style>
<div class="field"><div class="dot"></div></div>
