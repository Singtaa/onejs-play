name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      chrome:
        description: "A Chrome for Testing version to run the e2e on, instead of the runner image's Chrome"
        required: false
        default: ""
      chrome_log:
        description: "Chrome's own logging on the e2e: on, off, netlog (the network log only) or log (the verbose log only)"
        required: false
        default: "on"
      sample:
        description: "A label that keeps samples of one setup from cancelling each other"
        required: false
        default: ""

concurrency:
  # The Chrome a dispatched run names is part of the group, so runs on two
  # Chrome builds go side by side rather than cancelling each other.
  group: ci-${{ github.ref }}-${{ inputs.chrome }}-${{ inputs.chrome_log }}-${{ inputs.sample }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Report both platforms rather than stopping at the first red one: a
      # failure on one OS is usually the interesting result, not a reason to
      # hide the other.
      fail-fast: false
      matrix:
        # Windows is deliberate, not symmetry. Developers here work on Windows, so it has to be a gate and not an afterthought.
        os: [ubuntu-latest, windows-latest]

    defaults:
      run:
        working-directory: onejs-play

    steps:
      # Checked out into a named folder so the siblings below sit beside it.
      # onejs-play depends on them through "file:../" specifiers, which is the layout
      # the packages are developed in inside the container repo; a lone checkout
      # resolves none of them and fails before any test runs.
      - uses: actions/checkout@v4
        with:
          path: onejs-play

      - uses: actions/checkout@v4
        with:
          repository: Singtaa/onejs-react
          ref: main
          path: onejs-react

      - uses: actions/checkout@v4
        with:
          repository: Singtaa/onejs-unity
          ref: main
          path: onejs-unity

      # onejs-unity's shader language is the onejs-sl package, which it links
      # with "file:../onejs-sl" in the same layout.
      - uses: actions/checkout@v4
        with:
          repository: Singtaa/onejs-sl
          ref: main
          path: onejs-sl

      - uses: actions/checkout@v4
        with:
          repository: Singtaa/unity-types
          ref: main
          path: unity-types

      - uses: actions/setup-node@v4
        with:
          # The oldest Node oj run and oj test support (cli/chrome.mjs refuses
          # older): oj drives Chrome over the global WebSocket, which Node 20
          # does not have. The package declares no engines, so a OneJS project
          # installing it on older Node gets no warning for commands it never runs.
          node-version: 22
          cache: npm
          cache-dependency-path: onejs-play/package-lock.json

      # onejs-react is compiled from source as part of this typecheck, so it needs
      # its own dependencies present: tsc resolves an import inside it
      # relative to that folder, not to this one.
      - run: npm ci
        working-directory: onejs-react

      # onejs-unity is compiled from source as part of this typecheck, so it needs
      # its own dependencies present: tsc resolves an import inside it
      # relative to that folder, not to this one.
      - run: npm ci
        working-directory: onejs-unity

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint --if-present

      # Two steps, unit files first and the e2e files after, so they never share
      # the runner. The e2e files drive headless Chrome drawing in software,
      # and beside the unit workers they starved a Windows runner three times
      # on 6 Nov 2026: a worker's report to vitest went unanswered for its
      # 60 s limit and the run went red with every test passing.
      - run: npm run test:unit

      # A Chrome for Testing build when one is named, so an image update cannot
      # change the browser under the e2e; the runner's own Chrome otherwise.
      - name: Chrome for Testing
        if: inputs.chrome != ''
        shell: bash
        env:
          CFT: ${{ inputs.chrome }}
        run: |
          case "$RUNNER_OS" in
            Windows) platform=win64; exe=chrome.exe ;;
            Linux) platform=linux64; exe=chrome ;;
            *) echo "no Chrome for Testing platform for $RUNNER_OS"; exit 1 ;;
          esac
          dir="$RUNNER_TEMP/cft-$CFT"
          curl -fsSL -o "$RUNNER_TEMP/cft.zip" "https://storage.googleapis.com/chrome-for-testing-public/$CFT/$platform/chrome-$platform.zip"
          unzip -q "$RUNNER_TEMP/cft.zip" -d "$dir"
          echo "OJ_CHROME=$dir/chrome-$platform/$exe" >> "$GITHUB_ENV"

      - name: Which Chrome the e2e drives
        shell: pwsh
        run: |
          $chrome = if ($env:OJ_CHROME) { $env:OJ_CHROME } elseif ($IsWindows) { "C:\Program Files\Google\Chrome\Application\chrome.exe" } else { (Get-Command google-chrome).Source }
          if ($IsWindows) { "$chrome $((Get-Item $chrome).VersionInfo.ProductVersion)" } else { & $chrome --version }
          if ($IsWindows) { "Windows $([System.Environment]::OSVersion.Version)" }

      # A browser whose page never answers keeps Chrome's own verbose log and
      # network log (cli/chrome.mjs, chromeLog); every other one is deleted.
      - run: npm run test:e2e
        env:
          OJ_CHROME_LOG: ${{ (inputs.chrome_log || 'on') != 'off' && format('{0}/chrome-logs', runner.temp) || '' }}
          OJ_CHROME_LOG_ONLY: ${{ inputs.chrome_log == 'netlog' && 'netlog' || inputs.chrome_log == 'log' && 'log' || '' }}

      # What a failed sweep left running and lying about: a stall that grows
      # through a sweep reads very differently with forty Chromes still alive.
      - name: What the sweep left behind
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        run: |
          $chrome = @(Get-Process chrome -ErrorAction SilentlyContinue)
          "chrome.exe processes still running: $($chrome.Count)"
          $chrome | Sort-Object StartTime | Select-Object -First 20 Id, StartTime, CPU, WorkingSet64 | Format-Table | Out-String -Width 200
          "profiles left in temp: $(@(Get-ChildItem $env:TEMP -Directory -Filter 'oj-*' -ErrorAction SilentlyContinue).Count)"
          Get-CimInstance Win32_OperatingSystem | Select-Object FreePhysicalMemory, TotalVisibleMemorySize | Format-List | Out-String

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: chrome-logs-${{ matrix.os }}
          path: ${{ runner.temp }}/chrome-logs
          if-no-files-found: ignore
          retention-days: 7
